<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Admin</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; margin: 0; }
        .register-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 320px; }
        .register-container h2 { text-align: center; margin-bottom: 1.5rem; color: #333; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #666;}
        .form-group input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:hover { background: #218838; }
        .message { font-size: 0.875rem; margin-top: 1rem; text-align: center; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Registration Closed</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">
            New admin registrations are currently disabled for security reasons.
        </p>
        <div style="text-align: center;">
            <a href="login.html" style="color: #007bff; text-decoration: none; font-weight: bold;">Return to Login</a>
        </div>
    </div>

    <script>
        // Registration logic has been safely removed.
    </script>
</body>
</html>
