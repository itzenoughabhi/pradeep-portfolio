<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f1f5f9;
            --text-main: #334155;
            --text-muted: #64748b;
            --card: #ffffff;
            --border: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
        }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: var(--bg); 
            margin: 0; 
        }
        .login-container { 
            background: var(--card); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 380px; 
            border: 1px solid var(--border); 
        }
        .login-container h2 { 
            text-align: center; 
            margin: 0 0 8px 0; 
            color: #0f172a; 
            font-size: 24px; 
            font-weight: 600; 
        }
        .login-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--text-main); 
            font-size: 14px; 
            font-weight: 500; 
        }
        .form-group input { 
            width: 100%; 
            padding: 14px 18px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: inherit; 
            font-size: 14px; 
            background: #f8fafc; 
            color: var(--text-main); 
            transition: 0.2s; 
        }
        .form-group input:focus { 
            outline: none; 
            border-color: var(--primary); 
            background: #fff; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); 
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 500; 
            font-family: inherit; 
            transition: 0.2s; 
        }
        button:hover { 
            background: var(--primary-hover); 
            transform: translateY(-2px); 
        }
        .error { color: #ef4444; font-size: 13px; margin-top: 15px; text-align: center; font-weight: 500; }
        .forgot-password { text-align: center; margin-top: 20px; font-size: 13px; }
        .forgot-password a { color: var(--primary); text-decoration: none; font-weight: 500; transition: 0.2s; }
        .forgot-password a:hover { color: var(--primary-hover); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Jangra Admin</h2>
        <p class="login-subtitle">Sign in to manage your portfolio</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Login</button>
            <div id="errorMessage" class="error"></div>
        </form>
        <div class="forgot-password">
            <a href="#" id="forgotPasswordLink">Forgot Password?</a>
        </div>
    </div>

    <script>
        // Dynamic API Base URL - works for both local and production
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:5000' 
            : `${window.location.protocol}//${window.location.host}`;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('adminToken', data.token);
                    alert('Login successful! Redirecting to dashboard...');
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('errorMessage').innerText = data.message || 'Login failed';
                }
            } catch (err) {
                document.getElementById('errorMessage').innerText = 'Network error: Make sure your node server is running!';
            }
        });

        document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Registration is disabled. If you are locked out, please reset your password manually in the database.');
        });
    </script>
</body>
</html>
